<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Chat App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #17a2b8; height: 100vh; display: flex; align-items: center; justify-content: center; }

    /* Экран входа */
    #login-screen {
      background: #17a2b8; padding: 20px;
      display: flex; flex-direction: column; gap: 15px; width: 300px;
    }
    #login-screen input {
      padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;
    }
    #login-screen button {
      padding: 10px; background-color: #ffc107; border: none; border-radius: 4px;
      cursor: pointer; font-size: 16px; color: #333; font-weight: bold;
    }

    /* Экран чата */
    #chat-screen {
      display: none; width: 90vw; height: 90vh; background: #fff;
      border: 1px solid #0056b3; display: flex;
    }
    
    /* Сайдбар */
    .sidebar {
      width: 250px; background-color: #17a2b8; border-right: 1px solid #0056b3;
      display: flex; flex-direction: column;
    }
    .info-block, .users-block { background: #cce5ff; padding: 15px; border-bottom: 1px solid #fff; }
    .users-list { background: #fff; flex-grow: 1; padding: 10px; list-style: none; }
    .users-list li { padding: 5px 0; border-bottom: 1px solid #eee; }

    /* Основная зона чата */
    .chat-area {
      flex-grow: 1; display: flex; flex-direction: column; background: #fff;
    }
    .messages {
      flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .message {
      padding: 10px; border-radius: 4px; color: #fff; font-size: 14px;
      display: flex; flex-direction: column;
    }
    .message-header { font-size: 12px; margin-bottom: 5px; font-weight: bold; }
    
    /* Цвета сообщений */
    .msg-admin { background-color: #17a2b8; }
    .msg-self { background-color: #28a745; }
    .msg-other, .msg-auto { background-color: #ffc107; color: #333; }

    /* Поле ввода */
    .input-area {
      display: flex; border-top: 1px solid #ccc;
    }
    .input-area input {
      flex-grow: 1; padding: 15px; border: none; outline: none; font-size: 14px;
    }
    .input-area button {
      padding: 0 30px; background-color: #ffc107; border: none; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <input type="text" id="username" placeholder="user1" value="user1">
    <input type="text" id="room" placeholder="room1" value="room1">
    <button onclick="joinChat()">Приєднатись</button>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen" style="display: none;">
    <div class="sidebar">
      <div class="info-block">
        <div style="font-weight:bold;">Room: <span id="display-room"></span></div>
        <div style="font-size: 14px; color: #333;">Username: <span id="display-user" style="font-weight:bold; color: #0056b3;"></span></div>
      </div>
      <div class="users-block" style="font-size: 12px; color: #666;">Users in the chatroom</div>
      <ul class="users-list" id="users-list">
        <!-- Список пользователей будет здесь -->
      </ul>
    </div>
    
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Message" onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Подключаем клиент Socket.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    let socket;
    let currentUsername = '';
    let currentRoom = '';

    function joinChat() {
      currentUsername = document.getElementById('username').value.trim();
      currentRoom = document.getElementById('room').value.trim();

      if (!currentUsername || !currentRoom) return alert('Enter username and room');

      // Скрываем логин, показываем чат
      document.getElementById('login-screen').style.display = 'none';
      const chatScreen = document.getElementById('chat-screen');
      chatScreen.style.display = 'flex';
      
      // Сбрасываем flex-настройки, которые могли переопределиться из-за инлайн-стиля
      document.body.style.display = 'block'; 
      chatScreen.style.margin = '20px auto';

      document.getElementById('display-room').innerText = currentRoom;
      document.getElementById('display-user').innerText = currentUsername;

      // Добавляем себя в список (упрощенно, так как бекенд пока не шлет полный список)
      updateUsersList([currentUsername]);

      // Подключаемся к бекенду
      socket = io('http://localhost:3000');

      socket.emit('joinRoom', { username: currentUsername, room: currentRoom });

      socket.on('history', (messages) => {
        messages.forEach(msg => renderMessage(msg));
      });

      socket.on('message', (msg) => {
        renderMessage(msg);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (text && socket) {
        socket.emit('sendMessage', text);
        input.value = '';
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function renderMessage(msg) {
      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');

      // Определение цвета в зависимости от отправителя
      if (msg.isAutoMessage) {
        msgDiv.classList.add('msg-auto');
      } else if (msg.username === 'Admin') {
        msgDiv.classList.add('msg-admin');
      } else if (msg.username === currentUsername) {
        msgDiv.classList.add('msg-self');
      } else {
        msgDiv.classList.add('msg-other');
      }

      // Форматирование времени (если пришло с бекенда, иначе текущее)
      const timeStr = msg.time || new Date(msg.createdAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });

      msgDiv.innerHTML = `
        <div class="message-header">${msg.username} <span style="font-weight:normal; font-size:10px; margin-left:5px">${timeStr}</span></div>
        <div>${msg.text}</div>
      `;
      
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function updateUsersList(users) {
      const list = document.getElementById('users-list');
      list.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.innerText = u;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
